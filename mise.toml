# Every tool a contributor needs, including the ones the git hooks call, and
# its version. mise.lock records each download's checksum. Tools only CI needs
# are in mise.ci.toml, which mise loads only with MISE_ENV=ci.
min_version = "2026.10.0"

[settings]
lockfile = true

[tools]
# Go development
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "0.17.1"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:kubernetes-sigs/controller-runtime/setup-envtest" = "0.25.2"

# Git hooks and workflow linting
"aqua:pre-commit/pre-commit" = "4.7.0"
# pre-commit ships as a Python zipapp; pinning Python means it never runs on
# an old system python3 (macOS ships 3.9). It's also what yamale and yamllint
# run on, and pyyaml has no wheel for 3.15 yet, so stay on 3.14 until it does.
python = "3.14.10"
# mise installs the Python tools below from their lockfiles, which needs uv
# 0.12.10 or later.
uv = "0.12.23"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:gitleaks/gitleaks" = "8.30.1"

# Helm chart
"aqua:helm/helm" = "4.3.1"
"github:helm-unittest/helm-unittest" = "1.2.1"
"aqua:helm/chart-testing" = "3.15.0"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:norwoodj/helm-docs" = "1.14.2"
"aqua:aquasecurity/trivy" = "0.76.1"
"pipx:yamale" = "6.1.0"
yamllint = "1.38.0"

# Cluster validation
"aqua:kubernetes-sigs/kind" = "0.33.0"
"aqua:kubernetes/kubectl" = "1.37.1"

# Infrastructure for the e2e tests
"aqua:hashicorp/terraform" = "1.17.0"
"aqua:terraform-linters/tflint" = "0.65.0"
"aqua:jqlang/jq" = "1.8.2"

[vars]
e2e_cluster = "akv-issuer-e2e"
# renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
cert_manager_version = "v1.21.3"
e2e_namespace = "azure-keyvault-issuer"
e2e_image = "azure-keyvault-issuer:e2e"
e2e_aks_context = "akv-issuer-e2e-aks"
# renovate: datasource=helm depName=workload-identity-webhook registryUrl=https://azure.github.io/azure-workload-identity/charts
workload_identity_webhook_version = "1.6.1"

[env]
# Used by scripts when e2e testing
E2E_CLUSTER = "{{vars.e2e_cluster}}"
WORKLOAD_IDENTITY_WEBHOOK_VERSION = "{{vars.workload_identity_webhook_version}}"
E2E_ALLOW_CONTEXT = "{{ get_env(name='E2E_ALLOW_CONTEXT', default='kind-' ~ vars.e2e_cluster) }}"
E2E_CONTROLLER_NAMESPACE = "{{vars.e2e_namespace}}"
E2E_AZURE_SUBSCRIPTION = "{{ get_env(name='E2E_AZURE_SUBSCRIPTION', default='b422e843-2945-4646-82be-7365f96bdf5f') }}"
E2E_RESOURCE_GROUP = "{{ get_env(name='E2E_RESOURCE_GROUP', default='rg-akv-e2e-testing-pr-runs') }}"
E2E_INSTANCE = """
{%- if get_env(name='E2E_INSTANCE', default='') != '' -%}
  {{ get_env(name='E2E_INSTANCE') }}
{%- elif get_env(name='GITHUB_RUN_ID', default='') != '' -%}
  ci{{ (get_env(name='GITHUB_RUN_ID') ~ '-' ~ get_env(name='GITHUB_RUN_ATTEMPT', default='1') ~ '-' ~ get_env(name='GITHUB_JOB', default='')) | hash(len=5) }}
{%- else -%}
  dev{{ get_env(name='USER', default='x') | hash(len=3) }}
{%- endif -%}
"""
E2E_ENABLE_AKS = "{{ get_env(name='E2E_ENABLE_AKS', default='false') }}"
E2E_ENABLE_CLIENT_CREDENTIALS = "{{ get_env(name='E2E_ENABLE_CLIENT_CREDENTIALS', default='true') }}"
E2E_TFSTATE_RESOURCE_GROUP = "{{ get_env(name='E2E_TFSTATE_RESOURCE_GROUP', default='rg-akv-e2e-testing-bootstrap') }}"
E2E_TFSTATE_STORAGE_ACCOUNT = "{{ get_env(name='E2E_TFSTATE_STORAGE_ACCOUNT', default='stmgakve2etfstate') }}"
E2E_TFSTATE_CONTAINER = "{{ get_env(name='E2E_TFSTATE_CONTAINER', default='tfstate') }}"
_.file = [".e2e/infra.env", ".e2e/secrets.env", ".e2e/ca.env"]

[tasks.generate]
description = "Generate the DeepCopy methods"
run = 'controller-gen object:headerFile="api/boilerplate.go.txt" paths="./..."'

[tasks.manifests]
description = "Generate the CRDs"
run = 'controller-gen crd paths="./..." output:crd:artifacts:config=charts/azure-keyvault-issuer/files/crds'

[tasks.fmt]
description = "Format the Go code"
run = "go fmt ./..."

[tasks.vet]
description = "Vet the Go code"
run = "go vet ./..."

[tasks.test]
description = "Run the tests with envtest"
depends = ["manifests", "generate", "fmt", "vet"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
k8s_version="1.$(go list -m k8s.io/api | cut -d' ' -f2 | cut -d. -f2)"
export KUBEBUILDER_ASSETS="$(setup-envtest use "$k8s_version" --bin-dir bin -p path)"
go test ./... -coverprofile cover.out
'''

[tasks."e2e:kind:cluster:create"]
description = "Create the kind cluster for the e2e suite, if it does not exist. After e2e:infra:apply it signs tokens as the issuer that Entra trusts"
run = "scripts/kind-cluster.sh"

[tasks."e2e:kind:workload-identity:install"]
description = "Make the kind cluster usable for workload identity: publish its keys for Entra and install the Azure webhook. Needs e2e:infra:apply, and does nothing without it"
run = "scripts/kind-workload-identity.sh"

[tasks."e2e:kind:cluster:delete"]
description = "Delete the e2e kind cluster"
run = "kind delete cluster --name {{vars.e2e_cluster}}"

[tasks."e2e:cert-manager:install"]
description = "Install cert-manager into the e2e cluster, or upgrade it to the pinned version"
run = '''
helm upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager \
  --kube-context "$E2E_ALLOW_CONTEXT" --namespace cert-manager --create-namespace \
  --version {{vars.cert_manager_version}} --set crds.enabled=true --wait
'''

[tasks."e2e:kind:image:load"]
description = "Build the manager image and load it into the e2e kind cluster"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker build --build-arg VERSION=e2e --tag {{vars.e2e_image}} .
kind load docker-image {{vars.e2e_image}} --name {{vars.e2e_cluster}}
'''

[tasks."e2e:kind:chart:install"]
description = "Install the chart into the e2e cluster, or upgrade it, and restart the controller to pick up a rebuilt image"
run = "scripts/chart-install.sh kind"

[tasks."e2e:kind:up"]
description = "Make the kind cluster: cert-manager and the chart with the current code. Needs no Azure, but after e2e:azure:provision the cluster also has workload identity"
run = [
  { task = "e2e:kind:cluster:create" },
  { task = "e2e:cert-manager:install" },
  { task = "e2e:kind:workload-identity:install" },
  { task = "e2e:kind:image:load" },
  { task = "e2e:kind:chart:install" },
]

[tasks."e2e:kind:down"]
description = "Delete the kind cluster. Leaves the Azure resources, see e2e:infra:destroy"
run = [{ task = "e2e:kind:cluster:delete" }]

[tasks."e2e:aks:credentials"]
description = "Add the AKS cluster to the kubeconfig, as its own context. Needs e2e:infra:apply with E2E_ENABLE_AKS=true"
run = '''
az aks get-credentials --subscription "$E2E_AZURE_SUBSCRIPTION" --resource-group "${E2E_AKS_RESOURCE_GROUP:?not set, run e2e:infra:apply with E2E_ENABLE_AKS=true}" \
  --name "$E2E_AKS_NAME" --context {{vars.e2e_aks_context}} --overwrite-existing
'''

[tasks."e2e:aks:image:push"]
description = "Build the manager image for the AKS nodes (amd64) and push it to the e2e registry"
run = '''
#!/usr/bin/env bash
set -euo pipefail
az acr login --subscription "$E2E_AZURE_SUBSCRIPTION" --name "${E2E_ACR_NAME:?not set, run e2e:infra:apply with E2E_ENABLE_AKS=true}"
docker build --platform linux/amd64 --build-arg VERSION=e2e --tag "$E2E_ACR_LOGIN_SERVER/azure-keyvault-issuer:e2e" --push .
'''

[tasks."e2e:aks:chart:install"]
description = "Install the chart into the AKS cluster, or upgrade it, with the pushed image and the managed identity, and restart the controller"
run = "scripts/chart-install.sh aks"

[tasks."e2e:aks:up"]
description = "Make the AKS cluster ready: credentials, cert-manager, the image and the chart. Run with E2E_ENABLE_AKS=true E2E_ALLOW_CONTEXT=<e2e_aks_context>, as e2e:aks:run does"
run = [
  { task = "e2e:aks:credentials" },
  { task = "e2e:cert-manager:install" },
  { task = "e2e:aks:image:push" },
  { task = "e2e:aks:chart:install" },
]

[tasks."e2e:aks:run"]
description = "The whole e2e run on AKS: Azure resources, CA and cluster, then the cluster set up and the suite. Does not ask before applying, and is safe to repeat"
run = [
  # Each in a new mise, which loads the .e2e files that provisioning has just written, and the environment that
  # picks AKS and its context.
  "E2E_ENABLE_AKS=true mise run e2e:azure:provision",
  "E2E_ENABLE_AKS=true E2E_ALLOW_CONTEXT={{vars.e2e_aks_context}} mise run e2e:aks:up",
  "E2E_ENABLE_AKS=true E2E_ALLOW_CONTEXT={{vars.e2e_aks_context}} mise run test:e2e",
]

[tasks."e2e:aks:clean"]
description = "Destroy the Azure resources, which include the AKS cluster, and the recorded outputs, without asking"
run = "E2E_ENABLE_AKS=true mise run e2e:infra:destroy"

[tasks."e2e:kind:run"]
description = "The whole e2e run on kind, in order: Azure resources and the CA, the kind cluster with the chart, then the suite. Does not ask before applying, and is safe to repeat"
run = [
  { task = "e2e:azure:provision" },
  # Each in a new mise, so it loads the .e2e files that provisioning has just written.
  "mise run e2e:kind:up",
  "mise run test:e2e",
]

[tasks."e2e:kind:clean"]
description = "Delete the kind cluster and destroy the Azure resources and the recorded outputs, without asking"
run = [{ task = "e2e:kind:down" }, { task = "e2e:infra:destroy" }]

[tasks."e2e:infra:plan"]
description = "Show what the e2e Terraform would change. Does not lock the state"
run = "scripts/terraform.sh plan -lock=false"

[tasks."e2e:infra:apply"]
description = "Build the Azure resources in test/infra/e2e, and record their outputs in .e2e. Does not ask: see e2e:infra:plan first"
run = ["scripts/terraform.sh apply", "scripts/infra-env.sh"]

[tasks."e2e:infra:destroy"]
description = "Destroy what e2e:infra:apply built, and forget its outputs, without asking"
run = ["scripts/terraform.sh destroy", "rm -rf .e2e"]

[tasks."e2e:janitor"]
description = "Destroy the Azure resources of CI e2e runs that never cleaned up, older than MAX_AGE_HOURS (default 24). Needs an az login or OIDC, and leaves developers' own instances alone"
run = "scripts/e2e-janitor.sh"

[tasks."e2e:azure:ca"]
description = "Make the CA certificate in the e2e vault, with a non-exportable key. Needs e2e:infra:apply"
run = "scripts/azure-ca.sh"

[tasks."e2e:azure:provision"]
description = "Build the Azure resources and the CA in the vault, everything the suite needs from Azure"
run = [{ task = "e2e:infra:apply" }, { task = "e2e:azure:ca" }]

[tasks."test:e2e"]
description = "Run the e2e suite against the cluster in the current kubeconfig context"
# The suite takes longer than go test's default 10 minutes.
run = "go test -tags e2e ./test/e2e/... -v -timeout 60m"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.build]
description = "Build the manager binary"
depends = ["manifests", "generate", "fmt", "vet"]
run = "go build -o bin/manager ./cmd"

[tasks.run]
description = "Run the controller against the current cluster"
depends = ["manifests", "generate", "fmt", "vet"]
run = "go run ./cmd --leader-elect=false"

[tasks."tidy:check"]
description = "Check that go.mod and go.sum are tidy"
run = "go mod tidy -diff"

[tasks."generated:check"]
description = "Regenerate the deepcopy code, CRDs and chart README, and check that nothing changed"
depends = ["generate", "manifests", "chart:docs"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
git diff --exit-code -- api charts \
  || { echo "generated files are out of date, run: mise run generate manifests chart:docs" >&2; exit 1; }
'''

[tasks."tf:fmt"]
description = "Check the formatting of the e2e Terraform"
run = "terraform fmt -check -recursive -diff test/infra"

[tasks."tf:lint"]
description = "Lint the e2e Terraform with tflint"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for root in test/infra/*/; do
  echo "== $root"
  tflint --chdir "$root"
done
'''

[tasks."tf:validate"]
description = "Validate the e2e Terraform. Downloads the providers, but uses no backend"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for root in test/infra/*/; do
  echo "== $root"
  terraform -chdir="$root" init -backend=false -input=false > /dev/null
  terraform -chdir="$root" validate
done
'''

[tasks."actions:lint"]
description = "Lint the GitHub Actions workflows for errors and security issues"
run = ["actionlint", "zizmor .github"]

[tasks.secrets]
description = "Scan the git history and the working tree for secrets"
run = ["gitleaks git --redact --no-banner .", "gitleaks dir --redact --no-banner ."]

[tasks."secrets:staged"]
description = "Scan the staged changes for secrets"
run = "gitleaks git --staged --redact --no-banner ."

[tasks."trivy:fs"]
description = "Scan the repository for vulnerabilities, secrets and licences (settings in trivy-fs.yaml)"
run = "trivy fs --config trivy-fs.yaml ."

[tasks.check]
description = "Run every check CI runs, apart from e2e. Do this before you open a pull request"
depends = ["tidy:check", "lint", "test", "generated:check", "chart:check", "tf:fmt", "tf:lint", "tf:validate", "trivy:fs", "actions:lint"]
run = "echo all checks passed"

[tasks."commits:check"]
description = "Check that each commit since BASE (default origin/main) is a conventional commit"
run = '''
#!/usr/bin/env bash
set -euo pipefail
base="${BASE:-origin/main}"
msg="$(mktemp)"
trap 'rm -f "$msg"' EXIT
failed=0
for sha in $(git rev-list --no-merges "$base..HEAD"); do
  git log -1 --format=%B "$sha" > "$msg"
  if ! pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename "$msg" > /dev/null; then
    echo "Not a conventional commit: $(git log -1 --format='%h %s' "$sha")" >&2
    failed=1
  fi
done
exit "$failed"
'''

[tasks.hooks]
description = "Install the git hooks"
run = "pre-commit install"

[tasks."pre-commit"]
description = "Run every git hook against every file"
run = "pre-commit run --all-files --show-diff-on-failure"

[tasks."chart:lint"]
description = "Lint the chart with every ci/ values file, and check yaml, Chart.yaml and the version"
run = "ct lint --config .ct/ct.yaml --all"

[tasks."chart:test"]
description = "Run the chart's helm-unittest suites"
run = "untt charts/azure-keyvault-issuer"

[tasks."chart:kubeconform"]
description = "Validate the rendered chart against the Kubernetes API of each supported version"
run = "scripts/kubeconform.sh"

[tasks."chart:security"]
description = "Scan the chart for misconfigurations with every ci/ values file"
run = '''
#!/usr/bin/env bash
set -euo pipefail
for values in charts/azure-keyvault-issuer/ci/*-values.yaml; do
  echo "== $values"
  trivy config charts/azure-keyvault-issuer --helm-values "$values" --ignorefile .trivyignore.yaml \
    --severity HIGH,CRITICAL --exit-code 1 --skip-version-check --quiet
done
'''

[tasks."chart:docs"]
description = "Generate the chart README from values.yaml"
run = "helm-docs --chart-search-root charts"

[tasks."chart:docs-check"]
description = "Check that the chart README matches values.yaml"
run = '''
#!/usr/bin/env bash
set -euo pipefail
chart=charts/azure-keyvault-issuer
helm-docs --chart-search-root charts --dry-run --log-level error | diff - "$chart/README.md" \
  || { echo "$chart/README.md is out of date, run: mise run chart:docs" >&2; exit 1; }
'''

[tasks."chart:crds-check"]
description = "Check that the chart's CRDs match the API types"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
controller-gen crd paths="./..." output:crd:artifacts:config="$tmp"
diff -r "$tmp" charts/azure-keyvault-issuer/files/crds \
  || { echo "the chart's CRDs are out of date, run: mise run manifests" >&2; exit 1; }
'''

[tasks."chart:check"]
description = "Run every chart check"
depends = ["chart:lint", "chart:test", "chart:kubeconform", "chart:security", "chart:docs-check", "chart:crds-check"]
run = "echo chart checks passed"
