name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC.
  workflow_dispatch:
    inputs:
      aks:
        description: Also run on AKS
        type: boolean
        default: false

permissions: {}

env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.11.3

# Concurrency is set on each job, because kind may be cancelled by a newer push
# and AKS must not be.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only changes that can alter what the suite tests need it to run. A
      # manual run always does.
      - name: Filter Changed Paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(cmd/|internal/|api/|charts/|test/|scripts/|\.github/workflows/e2e\.yml$|go\.mod$|go\.sum$|Dockerfile$|mise\.toml$|mise\.lock$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-kind:
    needs: changes
    # A pull request from a fork gets no OIDC token, so it runs e2e-kind-fork.
    if: >-
      needs.changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: e2e-kind-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    permissions:
      contents: read
      id-token: write # Signs in to Azure with the job's OIDC token.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Check Azure Variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The variable $name is not set on the e2e environment or the repository"
              exit 1
            fi
          done

      - name: Sign In To Azure
        id: login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The Azure CLI cannot renew the job's GitHub OIDC token, which lasts five
      # minutes (Azure/azure-cli#28708), so a token for a new resource fails
      # after that. A managed identity's tokens last 24 hours, so fetching each
      # one the run uses now covers the whole job: Key Vault and Graph for the
      # suite, and Storage for the state blob. Sign-in has already fetched the
      # ARM token.
      - name: Cache Azure Tokens
        run: |
          for scope in https://vault.azure.net/.default https://graph.microsoft.com/.default \
            https://storage.azure.com/.default; do
            az account get-access-token --scope "$scope" --output none
          done

      - name: Run End-To-End Tests
        run: mise run e2e:kind:run

      # Nothing was built if sign-in failed, and a destroy without the Azure
      # session would only add a second error.
      - name: Delete Cluster And Azure Resources
        if: always() && steps.login.outcome == 'success'
        run: mise run e2e:kind:clean

  # Runs what needs no Azure, for pull requests from forks.
  e2e-kind-fork:
    needs: changes
    if: >-
      needs.changes.outputs.run == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    concurrency:
      group: e2e-kind-fork-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Create Cluster
        run: mise run e2e:kind:up

      - name: Run End-To-End Tests Without Azure
        run: mise run test:e2e -- -ginkgo.label-filter='!azure'

      - name: Delete Cluster
        if: always()
        run: mise run e2e:kind:down

  e2e-aks:
    # On a pull request: when the label is added, or on a push while it is
    # there, but not when some other label is added. A pull request from a fork
    # gets no OIDC token, so it cannot run.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.aks) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'labeled' && github.event.label.name == 'e2e-aks' ||
      github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'e2e-aks')))
    # Never cancelled, so a push cannot abandon a run that is creating a
    # cluster. A run that waits behind another is replaced by a newer one.
    concurrency:
      group: e2e-aks
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: e2e
    permissions:
      contents: read
      id-token: write # Signs in to Azure with the job's OIDC token.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Check Azure Variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The variable $name is not set on the e2e environment or the repository"
              exit 1
            fi
          done

      - name: Sign In To Azure
        id: login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # As for kind, with Container Registry as well, for 'az acr login'.
      - name: Cache Azure Tokens
        run: |
          for scope in https://vault.azure.net/.default https://graph.microsoft.com/.default \
            https://storage.azure.com/.default https://containerregistry.azure.net/.default; do
            az account get-access-token --scope "$scope" --output none
          done

      - name: Run End-To-End Tests
        run: mise run e2e:aks:run

      - name: Delete Azure Resources
        if: always() && steps.login.outcome == 'success'
        run: mise run e2e:aks:clean

  e2e-failure-issue:
    needs: [e2e-kind, e2e-aks]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report Failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="e2e-failure"
          gh label create "$label" --repo "$REPO" --color B60205 \
            --description "A scheduled e2e run failed" 2> /dev/null || true
          number=$(gh issue list --repo "$REPO" --label "$label" --state open --json number --jq '.[0].number // empty')
          body="The scheduled e2e run failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label "$label" \
              --title "Scheduled e2e run failed" --body "$body"
          fi

  # The one required check. It passes when e2e was skipped, which a required
  # job that never ran would not.
  e2e-result:
    needs: [changes, e2e-kind, e2e-kind-fork, e2e-aks]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check Results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::An e2e job finished as $result"
                exit 1
                ;;
            esac
          done
