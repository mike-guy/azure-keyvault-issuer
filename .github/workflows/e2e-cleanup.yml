name: e2e cleanup

# Cleans up after e2e runs whose runner died before it could destroy its Azure
# resources.
on:
  schedule:
    # Daily, so a leaked PR run lasts at most a day. 10:43 UTC is over six hours
    # (cleanup.sh's MAX_AGE_HOURS) after the Monday 03:17 runs start, so a
    # Monday run that leaks is removed the same day.
    - cron: "43 10 * * *"
  workflow_dispatch:

permissions: {}

# Two cleanup runs at once would destroy the same run twice.
concurrency:
  group: e2e-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e
    permissions:
      contents: read
      id-token: write # Signs in to Azure with the job's OIDC token.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      OIDC_STORAGE_ACCOUNT: ${{ vars.OIDC_STORAGE_ACCOUNT }}
      OIDC_SITE_URL: ${{ vars.OIDC_SITE_URL }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also installs Go from go.mod, which mise's go: tools are built with.
      - name: Setup Tools
        uses: ./.github/actions/setup-tools # zizmor: ignore[self-repository]
      - name: Sign In To Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Remove Abandoned Runs
        run: make e2e-cleanup
