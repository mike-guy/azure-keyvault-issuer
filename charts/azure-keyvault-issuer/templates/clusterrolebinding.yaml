{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "akvi.fullname" . }}-controller
  labels:
    {{- include "akvi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "akvi.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "akvi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.metrics.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "akvi.fullname" . }}-metrics-auth
  labels:
    {{- include "akvi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "akvi.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "akvi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
