{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "akvi.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "akvi.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "akvi.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
{{- end }}
