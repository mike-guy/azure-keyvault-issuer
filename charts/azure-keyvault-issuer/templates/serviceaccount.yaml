{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "akvi.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "akvi.labels" . | nindent 4 }}
  {{- $annotations := .Values.serviceAccount.annotations }}
  {{- if and .Values.workloadIdentity.useWebhook .Values.workloadIdentity.clientID }}
  {{- $annotations = merge (dict "azure.workload.identity/client-id" .Values.workloadIdentity.clientID "azure.workload.identity/tenant-id" (required "workloadIdentity.tenantID is required when workloadIdentity.clientID is set" .Values.workloadIdentity.tenantID)) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod mounts its API token explicitly (see the Deployment), so nothing else
# gets one by default.
automountServiceAccountToken: false
{{- end }}
