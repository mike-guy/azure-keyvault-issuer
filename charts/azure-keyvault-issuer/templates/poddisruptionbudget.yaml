{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "azure-keyvault-issuer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-keyvault-issuer.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "azure-keyvault-issuer.selectorLabels" . | nindent 6 }}
{{- end }}
