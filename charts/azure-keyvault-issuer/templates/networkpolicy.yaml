{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "azure-keyvault-issuer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-keyvault-issuer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "azure-keyvault-issuer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: health
          protocol: TCP
    {{- if and .Values.metrics.enabled .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
  egress:
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The API server, Microsoft Entra and Key Vault. A NetworkPolicy cannot name hosts, so any destination on 443.
    - ports:
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
