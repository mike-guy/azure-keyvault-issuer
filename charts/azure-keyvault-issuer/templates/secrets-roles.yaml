{{- if and .Values.rbac.create .Values.rbac.secretNamespaces }}
{{- /* Where the controller may read credentials: the listed namespaces and the cluster resource namespace. */}}
{{- $namespaces := append .Values.rbac.secretNamespaces (include "azure-keyvault-issuer.clusterResourceNamespace" .) | uniq | sortAlpha }}
{{- range $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "azure-keyvault-issuer.fullname" $ }}-credentials
  namespace: {{ . }}
  labels:
    {{- include "azure-keyvault-issuer.labels" $ | nindent 4 }}
rules:
  # Credentials for the client certificate and client secret methods, read one Secret at a time.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Tokens for workload identity.
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "azure-keyvault-issuer.fullname" $ }}-credentials
  namespace: {{ . }}
  labels:
    {{- include "azure-keyvault-issuer.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "azure-keyvault-issuer.fullname" $ }}-credentials
subjects:
  - kind: ServiceAccount
    name: {{ include "azure-keyvault-issuer.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
