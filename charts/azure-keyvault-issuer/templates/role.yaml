{{- if .Values.rbac.create }}
# Leader election, in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "azure-keyvault-issuer.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-keyvault-issuer.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  # The leader election lock records its changes of leader as events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "azure-keyvault-issuer.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-keyvault-issuer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "azure-keyvault-issuer.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "azure-keyvault-issuer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
