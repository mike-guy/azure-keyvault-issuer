suite: metrics
templates:
  - templates/service.yaml
  - templates/servicemonitor.yaml
tests:
  - it: renders no Service or ServiceMonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: exposes the metrics port through a Service
    template: templates/service.yaml
    release:
      name: rel
      namespace: ns
    set:
      metrics.enabled: true
      metrics.port: 9443
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: rel-azure-keyvault-issuer-metrics
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: azure-keyvault-issuer
            app.kubernetes.io/instance: rel
      - equal:
          path: spec.ports
          value:
            - name: metrics
              port: 9443
              targetPort: metrics
              protocol: TCP

  - it: scrapes secure metrics with the pod's token and skips verifying the self-signed certificate
    template: templates/servicemonitor.yaml
    release:
      namespace: ns
    set:
      metrics.enabled: true
      metrics.serviceMonitor.enabled: true
    asserts:
      - isKind:
          of: ServiceMonitor
      - equal:
          path: spec.namespaceSelector.matchNames
          value:
            - ns
      - equal:
          path: spec.endpoints
          value:
            - port: metrics
              interval: 30s
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true

  - it: uses the given TLS settings with the user's own certificate
    template: templates/servicemonitor.yaml
    set:
      metrics.enabled: true
      metrics.certSecretName: metrics-tls
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.tlsConfig:
        serverName: metrics.example.com
    asserts:
      - equal:
          path: spec.endpoints[0].tlsConfig
          value:
            serverName: metrics.example.com

  - it: scrapes plain HTTP without a token
    template: templates/servicemonitor.yaml
    set:
      metrics.enabled: true
      metrics.secure: false
      metrics.serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].scheme
          value: http
      - notExists:
          path: spec.endpoints[0].bearerTokenFile
      - notExists:
          path: spec.endpoints[0].tlsConfig

  - it: adds labels for a Prometheus to select on
    template: templates/servicemonitor.yaml
    set:
      metrics.enabled: true
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.labels:
        release: prometheus
    asserts:
      - equal:
          path: metadata.labels.release
          value: prometheus
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: azure-keyvault-issuer

  - it: fails to render a ServiceMonitor without metrics
    template: templates/servicemonitor.yaml
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: metrics.serviceMonitor.enabled needs metrics.enabled to be true
