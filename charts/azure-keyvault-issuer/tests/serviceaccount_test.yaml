suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
release:
  name: akvi
  namespace: cert-manager
tests:
  - it: does not automount its token
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: automountServiceAccountToken
          value: false
      - notExists:
          path: metadata.annotations

  - it: is not created when told not to
    set:
      serviceAccount.create: false
      serviceAccount.name: existing
    asserts:
      - hasDocuments:
          count: 0

  - it: annotates the identity for the webhook
    set:
      workloadIdentity.clientID: 00000000-0000-0000-0000-000000000001
      workloadIdentity.tenantID: 00000000-0000-0000-0000-000000000002
      workloadIdentity.useWebhook: true
    asserts:
      - equal:
          path: metadata.annotations
          value:
            azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000001
            azure.workload.identity/tenant-id: 00000000-0000-0000-0000-000000000002
