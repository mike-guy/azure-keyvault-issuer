suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: creates a service account named after the release
    release:
      name: rel
      namespace: ns
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: rel-azure-keyvault-issuer
      - equal:
          path: metadata.namespace
          value: ns
      - notExists:
          path: metadata.annotations

  - it: carries workload identity annotations
    set:
      serviceAccount.annotations:
        azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
    asserts:
      - equal:
          path: metadata.annotations["azure.workload.identity/client-id"]
          value: 00000000-0000-0000-0000-000000000000

  - it: uses serviceAccount.name when given
    set:
      serviceAccount.name: custom
    asserts:
      - equal:
          path: metadata.name
          value: custom

  - it: creates nothing when serviceAccount.create is false
    set:
      serviceAccount.create: false
      serviceAccount.name: existing
    asserts:
      - hasDocuments:
          count: 0
